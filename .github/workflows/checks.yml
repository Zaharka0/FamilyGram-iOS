name: Source and packaging checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - name: Check patch anchors against pinned official source
        run: |
          python3 scripts/checkout.py --no-submodules --sparse-check
          git -C source submodule update --init --depth=1 build-system/bazel-rules/rules_apple
          python3 scripts/patch_source.py
          python3 scripts/patch_rules.py
          python3 scripts/icons.py
          python3 scripts/check_prepared.py
  swift-core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate the Android reducer reference ledger
        run: python3 tests/generate_android_ledger.py
      - name: Compile and test the real Swift protocol core against Android vectors
        run: |
          mkdir -p build
          swiftc overlay/TelegramUI/FamilyCore.swift overlay/TelegramUI/FamilyReleasePolicy.swift overlay/TelegramUI/FamilyCalendar.swift tests/swift/main.swift -o build/family-core-tests
          build/family-core-tests tests/fixtures/fg1-android-vectors.json
      - name: Parse all native Swift overlays
        run: |
          for file in overlay/TelegramUI/*.swift overlay/TelegramCore/*.swift overlay/FamilyWidget/*.swift; do
            xcrun swiftc -frontend -parse "$file"
          done
      - name: Parse patched upstream Swift integration points
        run: |
          python3 scripts/checkout.py --no-submodules --sparse-check
          python3 scripts/patch_source.py
          find source -name '*.swift' -print0 | while IFS= read -r -d '' file; do
            xcrun swiftc -frontend -parse "$file"
          done
