name: Source and packaging checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - name: Check patch anchors against pinned official source
        run: |
          python3 scripts/checkout.py --no-submodules --sparse-check
          python3 scripts/patch_source.py
          python3 scripts/icons.py
          python3 scripts/check_prepared.py
